server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # add_header is inherited only by locations with no add_header of their
    # own, so /assets/ (which sets Cache-Control) includes the file again.
    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri /index.html;
    }

    # Static upstream resolution: nginx resolves "api" once at startup, so
    # restart web after recreating the api container.
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }
}
