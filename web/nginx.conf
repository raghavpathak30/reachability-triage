server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # add_header is inherited only by locations with no add_header of their
    # own, so /assets/ and /index.html (which set Cache-Control) include the file again.
    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri /index.html;
    }

    # The SPA shell (also reached by the try_files fallback and by "/") must
    # be revalidated so a rebuild's new hashed asset names are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Static upstream resolution: nginx resolves "api" once at startup, so
    # restart web after recreating the api container.
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        try_files $uri =404;
        # No "always": the long cache must apply to 200s only, never to a 404.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
