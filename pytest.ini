[pytest]
norecursedirs = .venv .claude tests/fixtures/l5 tests/fixtures/l5_phase4
markers =
    network: test makes a real network call (not run offline/in a sandboxed CI stage)
    real_llm: test calls the real Groq API (GROQ_API_KEY required); never run by a bare pytest invocation or any required CI job -- see tests/test_triage_langgraph_loop_adversarial_real.py
